<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>크로스링크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0c0a14;--panel:#1c1830;--panel2:#262040;--line:#4a4270;--ink:#f2efe6;--dim:#a8a2c0;--gold:#f2c94c;--good:#6fd67a;--bad:#f06a6a;--mon:#c9a66b;--fxm:#d9824a;--spell:#2f9a8a;--trap:#b0478a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;left:0;top:0;width:960px;height:600px;transform-origin:0 0;overflow:hidden;background:#000}
.hidden{display:none!important}
img,canvas{image-rendering:pixelated}
button{font-family:inherit;color:inherit;cursor:pointer}
/* ── 2.5D 필드 장면 ── */
#scene{position:absolute;inset:0;overflow:hidden;perspective:1000px;perspective-origin:50% 36%;background:var(--sky);--sky:#9fd4f5;--void:#2f7a3c}
#scene.bg-forest{--sky:#5f9a80;--void:#1f5a30}#scene.bg-coast{--sky:#a8dcf8;--void:#3f8ee8}#scene.bg-cave{--sky:#0c0a14;--void:#1a1622}#scene.bg-city{--sky:#cbbdf0;--void:#3a8a48}#scene.bg-indoor{--sky:#0e0b18;--void:#15121f}
#cam{position:absolute;left:480px;top:410px;transform-style:preserve-3d;transform:rotateX(50deg)}
#plane{position:absolute;left:0;top:0;transform-style:preserve-3d}
#plane::before{content:"";position:absolute;left:-3000px;top:-3000px;width:8000px;height:8000px;background:var(--void);transform:translateZ(-3px)}
.ground{position:absolute;left:0;top:0;image-rendering:pixelated}
.f3{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;background-repeat:repeat-x}
.ent{width:48px;height:48px;background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 0 1px rgba(0,0,0,.4))}

.shadow3{width:36px;height:16px;border-radius:50%;background:rgba(10,8,24,.38)}
.ent.bang::after{content:"!";position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#fff;color:#e03a3a;font:900 20px/1.2 sans-serif;border:2px solid #1a1626;border-radius:7px;padding:0 8px}
.bw-side{background:#d9cdb2;filter:brightness(.74)}.bw-roof.back{filter:brightness(.66)}.bw-roof{box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bw-front{background-repeat:no-repeat}
.p-xb{filter:brightness(1.05)}
#haze{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--sky) 0,transparent 30%),radial-gradient(ellipse at 50% 62%,transparent 52%,rgba(8,6,20,.5) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-60px);background:rgba(20,16,36,.92);border:2px solid var(--gold);border-radius:8px;padding:8px 22px;font-size:18px;font-weight:700;transition:transform .25s;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
.hud-btn{position:absolute;top:12px;right:12px;pointer-events:auto;background:rgba(20,16,36,.85);border:2px solid var(--line);border-radius:8px;padding:6px 14px;font-size:15px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#fade.on{opacity:1}

/* 대화창 */
#dialog{position:absolute;left:30px;right:30px;bottom:14px;height:112px;background:linear-gradient(#221c3a,#17132a);border:3px solid var(--gold);border-radius:12px;padding:18px 24px;font-size:20px;line-height:1.5;z-index:60;box-shadow:0 6px 0 rgba(0,0,0,.4)}
#dlg-name{position:absolute;top:-17px;left:18px;background:var(--gold);color:#1a1626;font-weight:800;font-size:15px;padding:3px 14px;border-radius:8px}
#dlg-next{position:absolute;right:16px;bottom:8px;color:var(--gold);animation:bob .7s infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#choices{position:absolute;right:40px;bottom:136px;display:flex;flex-direction:column;gap:6px;z-index:61;background:#17132a;border:3px solid var(--gold);border-radius:12px;padding:10px}
.choice{background:var(--panel2);border:2px solid transparent;border-radius:8px;padding:8px 22px;font-size:18px;text-align:left;min-width:200px}
.choice.on{border-color:var(--gold);background:#3a3260}

/* 버튼 공통 */
.btn{background:linear-gradient(#3a3260,#2a2448);border:2px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.big{background:linear-gradient(#f2c94c,#d9a520);color:#1a1626;border-color:#fff3c0;font-weight:800}
.btn.sm{padding:2px 8px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;color:#1a1626;margin-right:3px}
.chip.k-spell{background:var(--spell);color:#fff}.chip.k-trap{background:var(--trap);color:#fff}
.st{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:800;color:#fff;margin-left:4px}
.st-psn{background:#8a50b8}.st-brn{background:#e0552a}.st-par{background:#c8a010}.st-slp{background:#6a7a9a}.st-ko{background:#803030}
.up{color:var(--good)}.dn{color:var(--bad)}
.hpbar{height:9px;background:#0c0a14;border:1px solid #000;border-radius:5px;overflow:hidden;margin:4px 0}
.hpfill{height:100%;transition:width .45s;border-radius:4px}
.hpfill.g{background:linear-gradient(#8ff09a,#3fbf55)}.hpfill.y{background:linear-gradient(#ffe27a,#e0a820)}.hpfill.r{background:linear-gradient(#ff9a8a,#e03a3a)}.hpfill.lpf{background:linear-gradient(#8ad0ff,#3c8df0)}
.hint{color:var(--dim);font-size:14px;padding:8px;line-height:1.5}
.lv,.lvl{color:var(--gold);font-size:.85em;font-weight:700}
.gold,.price{color:var(--gold);font-weight:700}

/* 카드 */
.card{position:relative;flex:0 0 auto;width:92px;height:116px;border-radius:6px;border:2px solid #000;background:var(--mon);padding:3px;display:flex;flex-direction:column;cursor:pointer;color:#1a1626;box-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .12s}
.card.fxm{background:var(--fxm)}.card.k-spell{background:var(--spell)}.card.k-trap{background:var(--trap)}
.card .c-name{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.c-art{flex:1;background:radial-gradient(#fdf6e0,#cbbf9c);border:1px solid rgba(0,0,0,.5);border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.k-spell .c-art{background:radial-gradient(#e0fff8,#8cc8bc)}.k-trap .c-art{background:radial-gradient(#ffe0f4,#c890b4)}
.c-art img{height:100%;max-width:100%}
.card .c-foot{font-size:10px;font-weight:700;line-height:1.6;white-space:nowrap;letter-spacing:-.3px;overflow:hidden;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.c-foot i,.fc .attr{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid #000;margin-right:2px;vertical-align:-1px}
.card.ok{box-shadow:0 0 0 2px var(--gold),0 2px 0 rgba(0,0,0,.5)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #fff,0 8px 12px rgba(0,0,0,.6)}
.card .cnt{position:absolute;right:-4px;top:-6px;background:#1a1626;color:#fff;border:1px solid var(--gold);border-radius:8px;font-size:10px;padding:0 5px}
.card .cnt.full{background:var(--gold);color:#1a1626}
.cd{display:flex;flex-direction:column;gap:8px}
.cd-art{height:120px;border-radius:8px;border:3px solid var(--mon);background:radial-gradient(#fdf6e0,#b8ac88);display:flex;justify-content:center}
.cd-art.k-spell{border-color:var(--spell);background:radial-gradient(#e0fff8,#7cb8ac)}.cd-art.k-trap{border-color:var(--trap);background:radial-gradient(#ffe0f4,#b880a4)}
.cd-art img{height:100%}
.cd-name{font-size:18px;font-weight:800}
.cd-head{font-size:13px;margin:3px 0}
.cd-text{font-size:13.5px;line-height:1.5;background:rgba(0,0,0,.25);border-radius:6px;padding:6px 8px;min-height:44px}
.cd-note{font-size:12px;color:var(--dim);margin:3px 0}
.cd-btns{display:flex;flex-direction:column;gap:5px;margin-top:6px}

/* ── 전투 ── */
#battle{position:absolute;inset:0;z-index:20;background:#1a1626}
#battle.bg-field{background:linear-gradient(#7ec8f0 0,#bfe6f8 34%,#6cc070 34%,#3f9a50 100%)}
#battle.bg-forest{background:linear-gradient(#3a7a58 0,#5aa070 34%,#2f7a40 34%,#1f5a30 100%)}
#battle.bg-coast{background:linear-gradient(#6ab8f0 0,#a8dcf8 34%,#f0dca0 34%,#d8c080 100%)}
#battle.bg-cave{background:linear-gradient(#2a2230 0,#4a3c48 34%,#6a5a50 34%,#4a3c38 100%)}
#battle.bg-city{background:linear-gradient(#3a3068 0,#7a68a8 34%,#8a8698 34%,#5a5668 100%)}
#battle.bg-indoor{background:linear-gradient(#3a3050 0,#5a4a70 34%,#a88458 34%,#7a5c38 100%)}
.b-side{position:absolute;left:10px;width:640px;display:flex;align-items:center;gap:10px}
.b-opp{top:8px;height:212px}.b-me{top:266px;height:200px}
.b-banner{position:absolute;left:10px;top:224px;width:640px;height:38px;background:rgba(16,12,30,.9);border:2px solid var(--gold);border-radius:8px;display:flex;align-items:center;padding:0 12px;gap:10px;font-size:16px;font-weight:600}
.b-mode{background:var(--gold);color:#1a1626;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;flex:0 0 auto}
#b-msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#b-right{position:absolute;left:660px;top:8px;width:290px;height:458px;background:rgba(16,12,30,.88);border:2px solid var(--line);border-radius:10px;overflow:hidden}
#b-log{position:absolute;inset:0;padding:8px 10px;overflow-y:auto;font-size:12.5px;line-height:1.55;color:#d8d2ee}
#b-log .turn{color:var(--gold);font-weight:700;margin-top:4px}
#b-detail{position:absolute;inset:0;padding:10px;background:#1c1830;overflow-y:auto}
#b-detail.soft{background:rgba(28,24,48,.96)}
.b-bottom{position:absolute;left:10px;top:472px;width:940px;height:122px;display:flex;gap:10px}
#b-hand{flex:1;display:flex;gap:6px;align-items:center;padding:4px 8px;background:rgba(16,12,30,.8);border:2px solid var(--line);border-radius:10px;overflow-x:auto;overflow-y:hidden}
#b-cmd{width:210px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-content:center}
#b-cmd .btn{grid-column:span 2}#b-cmd .btn:nth-child(2):nth-last-child(2),#b-cmd .btn:nth-child(3):nth-last-child(1),#b-cmd .btn:only-child{grid-column:span 3}
#b-cmd .btn{padding:6px 8px}
#b-cmd .btn.big{grid-column:span 6;font-size:18px;padding:11px}
/* 테이머 패널 */
.b-opp.k-tamer{flex-direction:row}.b-me.k-tamer{flex-direction:row-reverse}
.tp-info{width:290px;background:rgba(16,12,30,.9);border:2px solid var(--line);border-radius:12px;padding:8px 14px}
.tp-owner{font-size:11px;color:var(--dim)}
.tp-name{font-size:19px;font-weight:800}
.tp-types{margin:3px 0}.stg{font-size:12px;font-weight:700;margin-left:4px}.stg span{margin-right:5px}
.tp-hp{font-size:13px;font-weight:700;text-align:right}
.tp-team{display:flex;gap:4px;margin-top:2px}
.tp-team i{width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid #000}
.tp-team i.x{background:#555}.tp-team i.a{box-shadow:0 0 0 2px var(--gold)}
.tp-sprite{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;border-radius:12px}
.tp-sprite .shadow{position:absolute;bottom:10px;width:150px;height:26px;background:rgba(0,0,0,.28);border-radius:50%}
.spr{width:176px;height:176px;position:relative;transition:transform .5s,opacity .5s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.b-opp .spr{width:160px;height:160px}
.spr.flip{transform:scaleX(-1)}
.spr.down{transform:translateY(60px) scaleY(.2);opacity:0}.spr.flip.down{transform:translateY(60px) scale(-1,.2)}
/* 듀얼리스트 패널 */
.dp-info{width:150px;background:rgba(16,12,30,.9);border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.ava{width:48px;height:48px}
.dp-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp{font-size:15px;color:#8ad0ff;font-weight:700}.lp b{font-size:26px;color:#fff}
.dp-counts{font-size:11px;color:var(--dim)}
.dp-field{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px}
.zone{position:relative;border-radius:8px}
.zone.mz,.zone.sz{width:112px;background:rgba(16,12,30,.45);border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
.zone.mz{height:124px;flex-direction:column}
.zone.sz{height:70px;gap:5px;padding:0 4px}
.zone.mz:not(.empty),.zone.sz:not(.empty){border-style:solid;border-color:rgba(255,255,255,.6)}
.fc{width:62px;height:78px;border-radius:5px;border:2px solid #000;background:var(--mon);padding:3px;display:flex;position:relative;transition:transform .2s;flex:0 0 auto}
.fc.fxm{background:var(--fxm)}.fc.k-spell{background:var(--spell)}.fc.k-trap{background:var(--trap)}
.fc.def{transform:rotate(90deg) scale(.88)}
.fc.own-fd{filter:brightness(.55)}
.fc.back{background:repeating-linear-gradient(45deg,#3a2a58,#3a2a58 6px,#4a3870 6px,#4a3870 12px);border-color:var(--gold)}
.fc.back::after{content:"";position:absolute;inset:22% 28%;border:2px solid var(--gold);transform:rotate(45deg)}
.fc.sm{width:42px;height:54px}
.fc .attr{position:absolute;left:1px;top:1px;margin:0}
.fc .st{position:absolute;right:-6px;bottom:-4px;margin:0}
.fc.def .st{transform:rotate(-90deg)}
.fz-name{font-size:10.5px;font-weight:700;max-width:106px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;line-height:1.3}
.sz .fz-name{white-space:normal;max-width:52px;font-size:10px}
.fz-stat{font-size:12.5px;font-weight:800;text-shadow:0 1px 2px #000;line-height:1.2}
.fz-stat b{opacity:.75}.fz-stat b.cur{opacity:1;font-size:14px}
.zone.sel{box-shadow:0 0 0 3px #fff}
#battle.picking .zone:not(.pick){opacity:.45}
.zone.pick{box-shadow:0 0 0 3px var(--gold);animation:pulse .6s infinite alternate;cursor:pointer}
@keyframes pulse{to{box-shadow:0 0 0 6px rgba(242,201,76,.5)}}
.ptag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#1a1626;border:2px solid var(--line);border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px;white-space:nowrap;z-index:3}
.ptag.good{border-color:var(--good);color:var(--good)}.ptag.bad{border-color:var(--bad);color:var(--bad)}
/* 기술 버튼 */
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.moves.col1{grid-template-columns:1fr;margin:6px 0}
.move{background:linear-gradient(90deg,var(--tc) 0,var(--tc) 8px,#2a2448 8px);border:2px solid var(--line);border-radius:8px;padding:6px 10px 6px 18px;text-align:left;display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:13px;align-items:center}
.move b{font-size:16px}.move span{color:var(--dim);font-size:12px}.move .pp{grid-row:1/3;grid-column:2;font-weight:700;color:var(--ink)}
.move:hover:not(:disabled){border-color:var(--gold)}
/* 이펙트 */
.fx-hit{animation:shake .35s}.tp-sprite.fx-hit::after{display:none}.tp-sprite.fx-hit .spr{animation:hitspr .35s}
@keyframes hitspr{0%,60%{filter:brightness(3) saturate(0)}30%{filter:brightness(1)}}.fx-hit::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--fx,#fff);animation:flash .35s forwards;pointer-events:none}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.fx-destroy::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;color:#fff;text-shadow:0 0 12px #f06a6a;animation:boom .5s forwards;pointer-events:none}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.fx-pop{animation:pop .3s}@keyframes pop{from{transform:scale(.4);opacity:.2}}
.fx-heal{animation:glowg .6s}@keyframes glowg{50%{box-shadow:0 0 26px 8px #6fd67a}}
.fx-buff{animation:glowy .6s}@keyframes glowy{50%{box-shadow:0 0 26px 8px #f2c94c}}
.fx-debuff{animation:glowp .6s}@keyframes glowp{50%{box-shadow:0 0 26px 8px #a060e0}}
.fx-trap{animation:glowr .6s}@keyframes glowr{50%{box-shadow:0 0 30px 10px #e04a9a}}
.fx-capsule{animation:caps .6s}@keyframes caps{30%{transform:scale(.3) rotate(20deg)}60%{transform:scale(.3) rotate(-20deg)}}
/* 전투 모달 */
#b-modal,#overlay{position:absolute;inset:0;background:rgba(8,6,16,.72);display:flex;align-items:center;justify-content:center;z-index:40}
#overlay{z-index:50}
#b-modal.result{background:rgba(8,6,16,.5)}
.res-box{text-align:center;background:var(--panel);border:4px solid var(--gold);border-radius:16px;padding:26px 60px}
.res-title{font-size:44px;font-weight:900;margin-bottom:14px}.good .res-title{color:var(--gold)}.bad .res-title{color:var(--dim)}
.mbox,.ov{background:var(--panel);border:3px solid var(--gold);border-radius:14px;padding:16px;width:440px;max-height:560px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.mbox.wide{width:640px}
.mtitle{font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.tlist{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.trow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 10px;text-align:left;font-size:15px}
.trow:hover:not(:disabled){border-color:var(--gold)}
.trow img{width:48px;height:48px;flex:0 0 auto}.trow>div{flex:1}.trow small{color:var(--dim);font-size:12px}
.trow.trap{border-color:var(--trap)}.trow.pack{border-color:var(--gold)}
.rules{font-size:14px;line-height:1.6;overflow-y:auto}.rules p{margin:5px 0}
/* 오버레이 */
.ov{position:absolute}
.ov.small{width:380px;align-items:stretch;text-align:center}.ov.mid{width:520px}.ov.wide{width:800px}.ov.full{width:930px;height:570px;max-height:570px;padding:12px}
.ov input{font:inherit;font-size:22px;text-align:center;padding:8px;border-radius:8px;border:2px solid var(--line);background:#0c0a14;color:var(--ink);user-select:text;-webkit-user-select:text}
.menu{display:flex;gap:12px;height:100%;min-height:0}
.tabs{display:flex;flex-direction:column;gap:6px;width:110px}
.tab{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:10px;font-size:16px;font-weight:700}
.tab.on{background:var(--gold);color:#1a1626;border-color:#fff3c0}
.mbody{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0;flex:1;overflow:hidden}.split>div{overflow-y:auto;min-height:0}
h3{margin:0 0 6px;font-size:15px}h3 small{color:var(--dim);font-weight:400;font-size:12px}
.bd-top{display:flex;gap:10px;align-items:center}.bd-spr{width:112px;height:112px;background:radial-gradient(#3a3260,transparent 70%)}

<script>
// ── js/core.js ──
// 크로스링크 — 공용 코어 (네임스페이스, 결정론적 RNG, 유틸)
// 브라우저(<script>)와 Node(require) 양쪽에서 동작한다.
(function (root) {
  const X = (root.XG = root.XG || {});

  // 결정론적 RNG (mulberry32). 상태가 정수 하나라 직렬화/네트워크 동기화가 쉽다.
  X.rngNext = function (holder) {
    let t = (holder.seed = (holder.seed + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  X.hash = function (str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };
  X.clone = (o) => JSON.parse(JSON.stringify(o));
  X.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  X.shuffle = function (arr, holder) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(X.rngNext(holder) * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  // 한국어 조사 처리: josa('리피', '이/가') -> '리피가'
  X.josa = function (word, pair) {
    const [a, b] = pair.split('/');
    const ch = word.charCodeAt(word.length - 1);
    if (ch < 0xac00 || ch > 0xd7a3) return word + (/[0-9]$/.test(word) ? ('013678'.includes(word.slice(-1)) ? a : b) : b);
    const jong = (ch - 0xac00) % 28;
    if (pair === '으로/로') return word + (jong === 0 || jong === 8 ? b : a);
    return word + (jong ? a : b);
  };

  if (typeof module !== 'undefined') module.exports = X;
})(typeof globalThis !== 'undefined' ? globalThis : this);

// ── js/data/beasts.js ──
// 속성 상성 · 기술 · 비스트(테이머 문화권) 데이터
(function (root) {
  const X = root.XG;

  // 비스트와 카드 몬스터가 공유하는 9속성. 두 세계를 잇는 공통 언어다.
  X.TYPES = {
    normal: { name: '무', color: '#a8a290' },
    fire: { name: '불', color: '#f0672e' },
    water: { name: '물', color: '#3c8df0' },
    grass: { name: '풀', color: '#4fb84a' },
    elec: { name: '전기', color: '#f2c318' },
    earth: { name: '땅', color: '#b0844a' },
    wind: { name: '바람', color: '#6fd0c8' },
    light: { name: '빛', color: '#f5e79a' },
    dark: { name: '어둠', color: '#7a5aa8' },
  };
  const CHART = {
    fire: { grass: 2, wind: 2, fire: 0.5, water: 0.5, earth: 0.5 },
    water: { fire: 2, earth: 2, water: 0.5, grass: 0.5 },
    grass: { water: 2, earth: 2, fire: 0.5, grass: 0.5, wind: 0.5 },
    elec: { water: 2, wind: 2, elec: 0.5, grass: 0.5, earth: 0.5 },
    earth: { fire: 2, elec: 2, grass: 0.5, wind: 0.5 },
    wind: { grass: 2, earth: 2, elec: 0.5 },
    light: { dark: 2, light: 0.5 },
    dark: { light: 2, dark: 0.5 },
    normal: {},
  };
  // 공격 속성 -> 방어 속성 배열에 대한 배율
  X.eff = function (atkType, defTypes) {
    let m = 1;
    for (const d of defTypes) m *= (CHART[atkType] && CHART[atkType][d]) || 1;
    return m;
  };

  // 기술: [이름, 속성, 위력, 명중, PP, 효과]
  // 효과: st(상태이상 부여 확률), self/foe(능력 랭크), heal(회복 비율), drain, pri(선공)
  const M = (name, type, pow, acc, pp, fx) => ({ name, type, pow, acc, pp, fx: fx || {} });
  X.MOVES = {
    ram: M('들이받기', 'normal', 40, 100, 35),
    claw: M('발톱 긋기', 'normal', 45, 100, 30),
    dash: M('질풍 돌진', 'normal', 40, 100, 25, { pri: 1 }),

        this.ev(crit ? '급소에 맞았다!' : e > 1 ? '효과가 굉장했다!' : e < 1 ? '효과가 별로인 듯하다…' : `${foe.name}에게 ${d}의 피해!`, { k: 'hit', side: o, type: mv.type, n: d });
        if (fx.drain && b.hp > 0) { b.hp = Math.min(b.maxhp, b.hp + Math.ceil(d / 2)); this.ev(`${J(b.name, '은/는')} 생기를 흡수했다!`, { k: 'heal', side: i }); }
        if (fx.st && foe.hp > 0 && !foe.status && this.rnd() * 100 < fx.st[1]) this.setBeastStatus(o, fx.st[0], true);
        this.checkFaint(o);
      } else this.selfOrFoeFx(i, mv, () => { if (fx.st) this.setBeastStatus(o, fx.st[0]); if (fx.foe) this.stage(o, fx.foe[0], fx.foe[1]); });
    }
    // 변화기 공통 처리 (자기 강화/회복은 어느 룰에서나 동일)
    selfOrFoeFx(i, mv, foeFn) {
      const b = this.active(i), fx = mv.fx;
      if (fx.self) this.stage(i, fx.self[0], fx.self[1]);
      if (fx.heal) {
        if (b.hp >= b.maxhp) this.ev('그러나 HP가 가득 차 있다!');
        else { b.hp = Math.min(b.maxhp, b.hp + Math.floor(b.maxhp * fx.heal)); this.ev(`${J(b.name, '은/는')} 체력을 회복했다!`, { k: 'heal', side: i }); }
      }
      if (fx.st || fx.foe) foeFn();
    }

    // ───────── 턴 진행 (dd / cross) ─────────
    startTurn() {
      const s = this.s, i = s.cur, sd = this.side(i);
      s.turn++; s.follow = false;
      this.ev(`── ${sd.name}의 턴 ──`, { k: 'turn', side: i });
      if (sd.kind !== 'duelist') return;
      sd.summoned = false;
      for (const m of sd.mons) if (m) { m.attacks = 0; m.moved = false; }
      if (s.turn > 1) {
        if (!sd.deck.length) return this.finish(1 - i, 'deck', `${J(sd.name, '은/는')} 더 이상 드로우할 카드가 없다!`);
        this.draw(i, 1);
      }
    }
    advance() { if (this.over) return; this.s.cur = 1 - this.s.cur; this.startTurn(); }
    draw(i, n) {
      const sd = this.side(i);
      let c = 0;
      while (n-- > 0 && sd.deck.length) { sd.hand.push(sd.deck.pop()); c++; }
      if (c) this.ev(`${J(sd.name, '은/는')} 카드를 ${c}장 드로우했다.`, { k: 'draw', side: i });
    }
    endTamerTurn(i) {
      if (this.halted()) return;
      this.tickBeast(i);
      if (this.halted()) return;
      this.advance();
    }
    endDuelTurn(i) {
      const sd = this.side(i);
      sd.mons.forEach((m, z) => {
        if (!m) return;
        m.tmpAtk = 0;
        if (m.status === 'psn') {
          m.atkMod -= 200; m.defMod -= 200;
          const c = X.CARDS[m.id];
          if (c.atk + m.atkMod <= 0) { this.ev(`${J(c.name, '은/는')} 독으로 쓰러졌다!`); this.destroyMon(i, z); }
        } else if ((m.status === 'par' || m.status === 'slp') && --m.stTurns <= 0) { m.status = null; this.ev(`${X.CARDS[m.id].name}의 상태이상이 풀렸다.`); }
      });
      if (this.halted()) return;
      this.advance();
    }

    // ───────── 카드 계산 ─────────
    aura(i, card, key) {
      const sd = this.side(i);
      let v = 0;
      for (const m of sd.mons) if (m && !m.faceDown) { const a = X.CARDS[m.id].fx.aura; if (a && (!a.attr || a.attr === card.attr)) v += a[key] || 0; }
      for (const t of sd.st) if (t && !t.faceDown) { const a = X.CARDS[t.id].aura; if (a && (!a.attr || a.attr === card.attr)) v += a[key] || 0; }
      return v;
    }
    equipSum(i, m, key) { let v = 0; for (const t of this.side(i).st) if (t && t.equipTo === m.uid) v += X.CARDS[t.id].equip[key]; return v; }
    getAtk(i, m) { const c = X.CARDS[m.id]; return Math.max(0, Math.round((c.atk + m.atkMod + (m.tmpAtk || 0) + this.equipSum(i, m, 'atk') + this.aura(i, c, 'atk')) * (m.status === 'brn' ? 0.7 : 1))); }
    getDef(i, m) { const c = X.CARDS[m.id]; return Math.max(0, c.def + m.defMod + this.equipSum(i, m, 'def') + this.aura(i, c, 'def')); }
    monZones(i) { const out = []; this.side(i).mons.forEach((m, z) => m && out.push(z)); return out; }
    freeZone(arr) { return arr.findIndex((x) => !x); }
    eligibleTraps(i, trig) {
      const sd = this.side(i), out = [];
      if (sd.kind !== 'duelist') return out;
      sd.st.forEach((t, z) => { if (t && t.faceDown && t.setTurn < this.s.turn && X.CARDS[t.id].trigger === trig) out.push(z); });
      return out;
    }
    tributeNeed(card) { return card.lv >= 7 ? 2 : card.lv >= 5 ? 1 : 0; }
    canSummon(i, h) {
      const sd = this.side(i), c = X.CARDS[sd.hand[h]];
      if (!c || c.kind !== 'mon' || sd.summoned) return null;
      const need = this.tributeNeed(c), have = this.monZones(i).length;
      if (have < need || (need === 0 && have >= 3)) return null;
      return { need };
    }
    canAttack(i, z) {
      const m = this.side(i).mons[z];
      return !!m && this.s.turn > 1 && !m.faceDown && m.pos === 'atk' && m.attacks < (X.CARDS[m.id].fx.twice ? 2 : 1) && m.status !== 'par' && m.status !== 'slp';
    }
    canChangePos(i, z) { const m = this.side(i).mons[z]; return !!m && !m.moved && m.turn < this.s.turn && !m.attacks && m.status !== 'slp'; }
    // 마법 발동 가능 여부. {target:'opp'|'own'|null} 또는 null
    spellInfo(i, h) {
      const sd = this.side(i), c = X.CARDS[sd.hand[h]], o = 1 - i, opp = this.side(o);
      if (!c || c.kind !== 'spell') return null;
      if (c.sub !== 'normal' && this.freeZone(sd.st) < 0) return null;
      if (c.sub === 'equip') return sd.mons.some((m) => m && !m.faceDown) ? { target: 'own' } : null;
      if (c.target === 'opp') { if (opp.kind === 'tamer') return { target: null }; return this.monZones(o).length ? { target: 'opp' } : null; }
      for (const op of c.ops || []) {
        if (op.op === 'destroyST' && !(opp.kind === 'duelist' && opp.st.some((t) => t))) return null;
        if (op.op === 'revive' && !(sd.grave.some((id) => X.CARDS[id].kind === 'mon') && this.freeZone(sd.mons) >= 0)) return null;
        if (op.op === 'atk' && op.who === 'allOwn' && !sd.mons.some((m) => m && !m.faceDown)) return null;
      }
      return { target: null };
    }

    // ───────── 카드 룰 행동 ─────────
    duelAct(i, a) {
      const s = this.s, sd = this.side(i), o = 1 - i, opp = this.side(o);
      switch (a.type) {
        case 'summon': {
          const info = this.canSummon(i, a.hand);
          if (!info) return false;
          const tr = a.tributes || [];
          if (tr.length !== info.need || new Set(tr).size !== tr.length || tr.some((z) => !sd.mons[z])) return false;
          const c = X.CARDS[sd.hand[a.hand]];
          sd.hand.splice(a.hand, 1);
          for (const z of tr) this.toGrave(i, z);
          const set = a.pos === 'set', z = this.freeZone(sd.mons);
          const m = (sd.mons[z] = this.newMon(c.id, set ? 'def' : 'atk', set));
          sd.summoned = true;
          this.ev(set ? `${J(sd.name, '은/는')} 몬스터를 뒷면 수비로 세트했다.` : `${J(sd.name, '은/는')} ${tr.length ? '제물을 바쳐 ' : ''}${J(c.name, '을/를')} 소환! (ATK ${c.atk})`, { k: 'summon', side: i, zone: z });
          if (set) return true;
          if (c.fx.onSummon) this.runOps(c.fx.onSummon, { side: i, name: c.name });
          if (this.halted() || sd.mons[z] !== m) return true;
          const traps = this.eligibleTraps(o, 'summon');
          if (traps.length) s.wait = { kind: 'trap', side: o, options: traps, ctx: { type: 'summon', side: i, zone: z, uid: m.uid } };
          return true;
        }
        case 'spell': {
          const info = this.spellInfo(i, a.hand);
          if (!info) return false;
          const c = X.CARDS[sd.hand[a.hand]];
          if (info.target === 'opp' && !opp.mons[a.target]) return false;
          if (info.target === 'own' && !(sd.mons[a.target] && !sd.mons[a.target].faceDown)) return false;
          sd.hand.splice(a.hand, 1);
          this.ev(`${J(sd.name, '은/는')} 마법 카드 「${c.name}」 발동!`, { k: 'spell', side: i, card: c.id });
          if (c.sub === 'equip') { sd.st[this.freeZone(sd.st)] = { id: c.id, faceDown: false, equipTo: sd.mons[a.target].uid }; this.ev(`${X.CARDS[sd.mons[a.target].id].name}에게 장착되었다.`, { k: 'buff', side: i, zone: a.target }); }
          else if (c.sub === 'cont') sd.st[this.freeZone(sd.st)] = { id: c.id, faceDown: false };
          else { this.runOps(c.ops, { side: i, name: c.name, target: a.target }); sd.grave.push(c.id); }
          return true;
        }
        case 'setST': {
          const c = X.CARDS[sd.hand[a.hand]], z = this.freeZone(sd.st);
          if (!c || c.kind !== 'trap' || z < 0) return false;
          sd.hand.splice(a.hand, 1);
          sd.st[z] = { id: c.id, faceDown: true, setTurn: s.turn };
          this.ev(`${J(sd.name, '은/는')} 카드를 1장 세트했다.`, { k: 'set', side: i });
          return true;
        }
        case 'pos': {
          if (!this.canChangePos(i, a.zone)) return false;
          const m = sd.mons[a.zone], c = X.CARDS[m.id];
          m.moved = true;
          if (m.faceDown) {
            m.faceDown = false; m.pos = 'atk';
            this.ev(`${J(sd.name, '은/는')} ${J(c.name, '을/를')} 반전 소환!`, { k: 'summon', side: i, zone: a.zone });
            if (c.fx.onFlip) this.runOps(c.fx.onFlip, { side: i, name: c.name });
          } else { m.pos = m.pos === 'atk' ? 'def' : 'atk'; this.ev(`${J(c.name, '은/는')} ${m.pos === 'atk' ? '공격' : '수비'} 표시가 되었다.`); }
          return true;
        }
        case 'attack': {
          if (!this.canAttack(i, a.zone)) return false;
          const m = sd.mons[a.zone];
          let target = a.target;
          if (opp.kind === 'tamer') target = 'beast';
          else if (this.monZones(o).length) { if (!opp.mons[target]) return false; }
          else target = 'direct';
          m.attacks++;
          const c = X.CARDS[m.id];
          this.ev(`${c.name}의 공격!${target === 'direct' ? ' 다이렉트 어택!' : ''}`, { k: 'attack', side: i, zone: a.zone, target });
          const ctx = { type: 'attack', side: i, zone: a.zone, uid: m.uid, target };
          const traps = this.eligibleTraps(o, 'attack');
          if (traps.length) s.wait = { kind: 'trap', side: o, options: traps, ctx };
          else this.resolveAttack(ctx, false);
          return true;
        }
        case 'run': {
          if (!s.wild || s.noRun) return false;
          this.finish(null, 'fled', '무사히 도망쳤다!');
          return true;
        }
        case 'end': this.endDuelTurn(i); return true;
      }
      return false;
    }
    newMon(id, pos, faceDown) { return { uid: this.s.uid++, id, pos, faceDown, turn: this.s.turn, attacks: 0, moved: false, atkMod: 0, defMod: 0, tmpAtk: 0, status: null, stTurns: 0 }; }
    // 필드를 떠날 때의 정리 (장착 카드는 묘지로)
    toGrave(i, z, toHand) {
      const sd = this.side(i), m = sd.mons[z];
      sd.mons[z] = null;
      (toHand ? sd.hand : sd.grave).push(m.id);
      sd.st.forEach((t, k) => { if (t && t.equipTo === m.uid) { sd.grave.push(t.id); sd.st[k] = null; } });
      return m;
    }
    destroyMon(i, z) {
      const m = this.side(i).mons[z];
      if (!m) return;
      const c = X.CARDS[m.id];
      this.toGrave(i, z);
      this.ev(`${J(c.name, '이/가')} 파괴되었다!`, { k: 'destroy', side: i, zone: z });
      if (c.fx.onDestroy) this.runOps(c.fx.onDestroy, { side: i, name: c.name });
    }
    hurtLP(i, n, text) {
      const sd = this.side(i);
      n = Math.max(0, Math.round(n));
      if (!n) return;
      sd.lp = Math.max(0, sd.lp - n);
      this.ev(text || `${sd.name}에게 ${n} 데미지!`, { k: 'lp', side: i, n });
      if (sd.lp <= 0) this.finish(1 - i, 'lp', `${sd.name}의 LP가 0이 되었다!`);
    }
    // 플레이어에게 가는 효과 데미지. 테이머는 LP가 없으므로 선두 비스트가 대신 받는다 (n/K HP).
    hurtPlayer(i, n) {
      const sd = this.side(i);
      if (sd.kind === 'duelist') return this.hurtLP(i, n);
      const b = this.active(i), d = this.hurtBeast(i, b.maxhp * n / this.side(1 - i).maxLp * X.CROSS.BURN);
      this.ev(`${J(b.name, '이/가')} 대신 ${d}의 피해를 받았다!`, { k: 'hit', side: i, n: d });
      this.checkFaint(i);
    }

    // 대상 해석: {side, zone} (테이머 쪽은 zone === 'beast')
    unit(who, ctx) {
      const o = 1 - ctx.side, opp = this.side(o);
      if (who === 'attacker') return ctx.attacker;
      if (who === 'summoned') return ctx.summoned;
      if (opp.kind === 'tamer') return { side: o, zone: 'beast' };
      if (who === 'target') return opp.mons[ctx.target] ? { side: o, zone: ctx.target } : null;
      if (who === 'strongest') {
        let best = null, bv = -1;
        opp.mons.forEach((m, z) => { if (!m) return; const v = m.faceDown ? 0 : this.getAtk(o, m) + 1; if (v > bv) { bv = v; best = z; } });
        return best == null ? null : { side: o, zone: best };
      }
      return null;
    }
    unitAlive(u) {
      if (!u) return false;
      if (u.zone === 'beast') return this.active(u.side).hp > 0;
      const m = this.side(u.side).mons[u.zone];
      return !!m && (u.uid == null || m.uid === u.uid);
    }
    // ── 크로스 환산: 카드 효과가 비스트에게 닿을 때 ──
    unitDestroy(u) {
      if (!this.unitAlive(u)) return;
      if (u.zone !== 'beast') return this.destroyMon(u.side, u.zone);
      const b = this.active(u.side), d = this.hurtBeast(u.side, b.maxhp * X.CROSS.DESTROY);
      this.ev(`파괴의 힘이 ${J(b.name, '을/를')} 덮쳤다! ${d}의 피해!`, { k: 'hit', side: u.side, n: d });
      this.checkFaint(u.side);
    }
    unitAtk(u, n, temp) {
      if (!this.unitAlive(u)) return;
      if (u.zone === 'beast') return this.stage(u.side, 'atk', (n > 0 ? 1 : -1) * (Math.abs(n) >= 500 ? 2 : 1));
      const m = this.side(u.side).mons[u.zone];
      if (temp) m.tmpAtk = (m.tmpAtk || 0) + n; else m.atkMod += n;
      if (!m.faceDown) this.ev(`${X.CARDS[m.id].name}의 ATK ${n > 0 ? '+' : ''}${n}!`, { k: n > 0 ? 'buff' : 'debuff', side: u.side, zone: u.zone });
    }
    unitStatus(u, st) {
      if (!this.unitAlive(u)) return;
      if (u.zone === 'beast') return this.setBeastStatus(u.side, st);
      const m = this.side(u.side).mons[u.zone], c = X.CARDS[m.id];
      if (m.status) return this.ev(`${J(m.faceDown ? '그 몬스터' : c.name, '은/는')} 이미 상태이상이다.`);
      m.status = st;
      m.stTurns = (st === 'slp' ? 2 : 1) + (this.s.cur === u.side ? 1 : 0);
      this.ev(`${J(m.faceDown ? '세트 몬스터' : c.name, '은/는')} ${{ psn: '독에 걸렸다 (매 턴 ATK/DEF -200)', brn: '화상을 입었다 (ATK 30% 감소)', par: '마비되어 다음 턴 공격할 수 없다', slp: '잠들어 공격할 수 없다' }[st]}!`, { k: 'status', side: u.side, zone: u.zone });
    }
    unitBounce(u) {
      if (!this.unitAlive(u)) return;
      const sd = this.side(u.side);
      if (u.zone !== 'beast') { const m = this.toGrave(u.side, u.zone, true); return this.ev(`${J(X.CARDS[m.id].name, '은/는')} 패로 되돌아갔다!`, { k: 'destroy', side: u.side, zone: u.zone }); }
      const others = sd.team.map((b, k) => k).filter((k) => k !== sd.active && sd.team[k].hp > 0);
      if (!others.length) return this.ev('그러나 교체할 비스트가 없다!');
      this.ev(`${J(this.active(u.side).name, '은/는')} 바람에 휩쓸려 물러났다!`);
      this.switchIn(u.side, others[Math.floor(this.rnd() * others.length)]);
    }

    runOps(ops, ctx) {
      const res = {}, i = ctx.side, o = 1 - i, sd = this.side(i), opp = this.side(o);
      for (const op of ops) {
        if (this.over) break;
        switch (op.op) {
          case 'dmg': this.hurtPlayer(o, op.n); break;
          case 'heal': sd.lp += op.n; this.ev(`${sd.name}의 LP가 ${op.n} 회복되었다.`, { k: 'heal', side: i, lp: 1 }); break;
          case 'draw': this.draw(i, op.n); break;
          case 'negate': res.negate = true; break;
          case 'destroy': this.unitDestroy(this.unit(op.who, ctx)); break;
          case 'status': this.unitStatus(this.unit(op.who, ctx), op.st); break;
          case 'bounce': this.unitBounce(this.unit(op.who, ctx)); break;
          case 'atk': {
            if (op.who === 'allOwn') sd.mons.forEach((m, z) => m && !m.faceDown && this.unitAtk({ side: i, zone: z }, op.n, op.temp));
            else if (op.who === 'allOpp') { if (opp.kind === 'tamer') this.unitAtk({ side: o, zone: 'beast' }, op.n); else opp.mons.forEach((m, z) => m && !m.faceDown && this.unitAtk({ side: o, zone: z }, op.n, op.temp)); }
            else this.unitAtk(this.unit(op.who, ctx), op.n, op.temp);
            break;
          }
          case 'destroyST': {
            if (opp.kind !== 'duelist') break;
            const zs = []; opp.st.forEach((t, z) => t && zs.push(z));
            if (!zs.length) break;
            const z = zs.find((k) => !opp.st[k].faceDown) ?? zs[Math.floor(this.rnd() * zs.length)];
            const t = opp.st[z]; opp.st[z] = null; opp.grave.push(t.id);
            this.ev(`${opp.name}의 「${X.CARDS[t.id].name}」이(가) 파괴되었다!`, { k: 'destroy', side: o });
            break;
          }
          case 'revive': {
            const z = this.freeZone(sd.mons);
            let best = -1;
            sd.grave.forEach((id, k) => { const c = X.CARDS[id]; if (c.kind === 'mon' && c.name !== ctx.name && (best < 0 || c.atk > X.CARDS[sd.grave[best]].atk)) best = k; });
            if (z < 0 || best < 0) break;
            const id = sd.grave.splice(best, 1)[0];
            sd.mons[z] = this.newMon(id, 'atk', false);
            this.ev(`${J(X.CARDS[id].name, '이/가')} 묘지에서 되살아났다!`, { k: 'summon', side: i, zone: z });
            break;
          }
          case 'search': {
            const idxs = []; sd.deck.forEach((id, k) => { const c = X.CARDS[id]; if (c.kind === 'mon' && c.lv <= 4) idxs.push(k); });
            if (!idxs.length) break;
            const id = sd.deck.splice(idxs[Math.floor(this.rnd() * idxs.length)], 1)[0];
            sd.hand.push(id);
            this.ev(`${J(sd.name, '은/는')} 덱에서 몬스터 1장을 패에 넣었다.`, { k: 'draw', side: i });
            break;
          }
        }
      }
      return res;
    }

    resumeTrap(ctx, idx) {
      const owner = 1 - ctx.side;
      let neg = false;
      if (idx != null) {
        const sd = this.side(owner), t = sd.st[idx], c = X.CARDS[t.id];
        sd.st[idx] = null; sd.grave.push(c.id);
        this.ev(`${sd.name}의 함정 발동! 「${c.name}」`, { k: 'trap', side: owner, card: c.id });

      return new Promise((res) => {
        const m = $('#b-modal');
        m.className = 'result ' + (good ? 'good' : 'bad');
        m.innerHTML = `<div class="res-box"><div class="res-title">${text}</div><button class="btn" data-act="close">계속</button></div>`;
        this.skipFn = this.onClose = () => { this.skipFn = this.onClose = null; m.className = 'hidden'; res(); };
      });
    },

    // ── 플레이어 입력 ──
    ask(req) {
      this.clearSel();
      return new Promise((res) => {
        this.done = (a) => { this.done = null; G.sfx('ok'); res(a); };
        if (req.kind === 'switch') { this.setMsg('다음에 내보낼 비스트를 고르자.'); this.teamModal((k) => this.bt.canSwitch(UI.ME, k), (k) => this.done({ type: 'switch', to: k }), true); }
        else if (req.kind === 'trap') this.trapModal(req);
        else if (req.kind === 'tamer') { this.setMsg(`${this.bt.active(UI.ME).name}${this.bt.s.follow ? ' — 쾌속! 한 번 더' : ''} 무엇을 할까?`); this.tamerCmd(); }
        else { this.setMsg('내 턴 — 카드를 골라 행동하자.'); this.duelCmd(); }
      });
    },
    click(e) {
      const t = e.target, act = t.closest('[data-act]');
      if (act) { e.stopPropagation(); return this.act(act.dataset.act, act.dataset); }
      const z = t.closest('.zone'), hand = t.closest('[data-hand]');
      if (this.picking) {
        if (z && +z.dataset.side === this.picking.side && this.picking.zones.includes(z.dataset.zone === 'beast' ? 'beast' : +z.dataset.zone) && z.dataset.st == null) { const p = this.picking; G.sfx('sel'); return p.cb(+z.dataset.zone); }
        return;
      }
      if (hand) return this.selectHand(+hand.dataset.hand);
      if (z) return this.selectZone(+z.dataset.side, z.dataset);
      if (!t.closest('#b-right') && !t.closest('#b-cmd')) this.clearSel();
    },
    act(name, d) {
      const f = this.acts && this.acts[name];
      if (name === 'close' && this.onClose) return this.onClose();
      if (name === 'cancel') return this.cancelPick();
      if (name === 'speed') { G.speed = { 1: 2, 2: 4, 4: 1 }[G.speed || 1]; const e = $('#battle [data-act=speed]'); if (e) e.textContent = '▶ ×' + G.speed; return; }
      if (name === 'forfeit') { if (this.cfg.net && !this.bt.over) { X.Net.send({ t: 'b:forfeit', bid: this.cfg.net.bid }); this.setMsg('기권했다…'); } return; }
      if (name === 'auto') {
        this.auto = !this.auto;
        const e = $('#battle [data-act=auto]'); if (e) e.classList.toggle('on', this.auto);
        if (this.auto && this.done && this.bt.request(UI.ME)) { this.picking = null; this.paintPick(); $('#b-modal').className = 'hidden'; this.done(X.AI.decide(this.bt, UI.ME)); }
        return;
      }
      if (f) f(d);
    },
    showDetail(html, soft) { const d = $('#b-detail'); d.innerHTML = html; d.classList.remove('hidden'); d.classList.toggle('soft', !!soft); },
    clearSel() { this.sel = null; this.acts = this.baseActs || {}; const d = $('#b-detail'); if (d) d.classList.add('hidden'); document.querySelectorAll('#battle .sel').forEach((x) => x.classList.remove('sel')); },
    cancelPick() { if (!this.picking) return; this.picking = null; this.paintPick(); this.clearSel(); if (this.cmdBack) this.cmdBack(); },
    // 대상 선택 모드
    pick(side, zones, prompt, cb, tagFn) {
      this.picking = { side, zones, tagFn, cb: (z) => { this.picking = null; this.paintPick(); cb(z); } };
      this.setMsg(prompt);
      $('#b-detail').classList.add('hidden');
      this.paintPick();
    },
    paintPick() {
      document.querySelectorAll('#battle .pick').forEach((x) => { x.classList.remove('pick'); const t = x.querySelector('.ptag'); if (t) t.remove(); });
      const p = this.picking;
      $('#battle').classList.toggle('picking', !!p);
      if (!p) return;
      for (const z of p.zones) {
        const e = $(`#bs${p.side} .zone[data-zone="${z}"]:not(.sz)`);
        if (!e) continue;
        e.classList.add('pick');
        if (p.tagFn) { const tag = p.tagFn(z); if (tag) e.appendChild(el('div', 'ptag ' + tag[1], tag[0])); }
      }
    },

    // ── 테이머 커맨드 ──
    tamerCmd() {
      const bt = this.bt, cross = bt.mode === 'cross', b = bt.active(UI.ME);
      const main = () => {
        this.cmdBack = null;
        $('#b-hand').innerHTML = `<div class="hint">${cross ? '크로스 룰: 기술은 <b>스트라이크</b>가 되어 몬스터의 ATK/DEF와 겨룬다. 몬스터가 없으면 상대 LP에 직접!' : '비스트 룰: 스피드가 빠른 쪽이 먼저 움직인다. 속성 상성을 노리자.'}</div>`;
        $('#b-cmd').innerHTML = `<button class="btn big" data-act="fight">싸운다</button><button class="btn" data-act="team">비스트</button><button class="btn" data-act="bag">가방</button>${bt.s.wild && bt.mode === 'tt' ? '<button class="btn" data-act="run">도망</button>' : '<button class="btn" data-act="rules">룰</button>'}`;
      };
      const fight = () => {
        this.cmdBack = main;
        const usable = b.moves.some((m) => m.pp > 0);
        const foeTypes = bt.side(UI.OP).kind === 'tamer' ? X.BEASTS[bt.active(UI.OP).sp].types : null;
        const btn = (mv, k, pp) => {
          const info = mv.pow > 0 ? (cross ? `스트라이크 ${Math.round(bt.strikeBase(UI.ME, mv, null) / 10) * 10}` : `위력 ${mv.pow}`) : '변화';
          const e = foeTypes && mv.pow > 0 ? X.eff(mv.type, foeTypes) : 1;
          return `<button class="move" data-act="move" data-i="${k}" ${pp === 0 ? 'disabled' : ''} style="--tc:${X.TYPES[mv.type].color}"><b>${mv.name}</b><span>${X.TYPES[mv.type].name} · ${info}${e > 1 ? ' · <em class="up">효과 굉장</em>' : e < 1 ? ' · <em class="dn">효과 별로</em>' : ''}</span><span class="pp">${pp == null ? '' : `PP ${pp}/${mv.pp}`}</span></button>`;
        };
        $('#b-hand').innerHTML = `<div class="moves">${usable ? b.moves.map((m, k) => btn(X.MOVES[m.id], k, m.pp)).join('') : btn({ name: '발버둥', type: 'normal', pow: 35, pp: 1 }, -1, null)}</div>`;
        $('#b-cmd').innerHTML = `<button class="btn" data-act="back">뒤로</button>`;
      };
      this.acts = this.baseActs = {
        fight, back: main, rules: () => this.rulesModal(),
        run: () => this.done({ type: 'run' }),
        team: () => this.teamModal((k) => bt.canSwitch(UI.ME, k), (k) => this.done({ type: 'switch', to: k })),
        bag: () => this.bagModal(),
        move: (d) => {
          const k = +d.i, mv = bt.moveOf(UI.ME, k);
          if (!mv) return;
          if (!cross) return this.done({ type: 'move', move: k });
          const zones = bt.monZones(UI.OP);
          const needs = mv.pow > 0 || mv.fx.st || mv.fx.foe;
          if (!needs || !zones.length) return this.done({ type: 'move', move: k, target: 'direct' });
          if (zones.length === 1) return this.done({ type: 'move', move: k, target: zones[0] });
          $('#b-cmd').innerHTML = `<button class="btn" data-act="cancel">취소</button>`;
          this.cmdBack = fight;
          this.pick(1, zones, `${mv.name} — 대상 몬스터를 고르자.`, (z) => this.done({ type: 'move', move: k, target: z }), (z) => {
            if (!mv.pow) return null;
            const m = this.v.sides[1].mons[z];
            if (m.hidden) return ['?', ''];
            const S = Math.round(bt.strikeBase(UI.ME, mv, X.CARDS[m.id].attr) * 0.96 / 10) * 10, val = m.pos === 'atk' ? m.a : m.d;
            return [`${S} ${S >= val ? '≥' : '<'} ${val}`, S >= val ? 'good' : 'bad'];
          });
        },
      };
      main();
    },
    teamModal(valid, cb, forced) {
      const sd = this.bt.side(UI.ME), m = $('#b-modal');
      m.className = 'modal';
      m.innerHTML = `<div class="mbox"><div class="mtitle">비스트 선택</div><div class="tlist">${sd.team.map((b, k) => `<button class="trow" data-act="tpick" data-i="${k}" ${valid(k) ? '' : 'disabled'}><img src="${A.beastUrl(b.sp)}"><div><b>${b.name}</b> Lv.${b.lv} ${b.status ? `<span class="st st-${b.status}">${X.STATUS[b.status]}</span>` : ''}${k === sd.active ? ' <i>(전투 중)</i>' : ''}<div class="hpbar"><div class="hpfill ${this.hpCls((b.hp / b.maxhp) * 100)}" style="width:${(b.hp / b.maxhp) * 100}%"></div></div><small>HP ${b.hp}/${b.maxhp}</small></div></button>`).join('')}</div>${forced ? '' : '<button class="btn" data-act="mclose">취소</button>'}</div>`;
      const prev = this.acts;
      this.acts = Object.assign({}, prev, { tpick: (d) => { m.className = 'hidden'; this.acts = prev; cb(+d.i); }, mclose: () => { m.className = 'hidden'; this.acts = prev; } });
    },
    bagModal() {
      const bt = this.bt, sd = bt.side(UI.ME), bag = sd.bag || {}, m = $('#b-modal');
      const items = Object.keys(bag).filter((k) => bag[k] > 0 && (X.ITEMS[k].ball ? bt.s.wild && bt.mode === 'tt' : true));
      m.className = 'modal';
      m.innerHTML = `<div class="mbox"><div class="mtitle">가방</div><div class="tlist">${items.length ? items.map((k) => `<button class="trow" data-act="ipick" data-i="${k}"><div><b>${X.ITEMS[k].name}</b> ×${bag[k]}<br><small>${X.ITEMS[k].desc}</small></div></button>`).join('') : '<div class="hint">쓸 수 있는 도구가 없다.</div>'}</div><button class="btn" data-act="mclose">취소</button></div>`;
      const prev = this.acts;
      this.acts = Object.assign({}, prev, {
        mclose: () => { m.className = 'hidden'; this.acts = prev; },
        ipick: (d) => {
          const it = X.ITEMS[d.i];
          this.acts = prev;
          if (it.ball) { m.className = 'hidden'; return this.done({ type: 'capture', item: d.i }); }
          this.teamModal((k) => !!bt.useItem(UI.ME, { item: d.i, target: k }), (k) => this.done({ type: 'item', item: d.i, target: k }));
        },
      });
    },
    trapModal(req) {
      const sd = this.bt.side(UI.ME), m = $('#b-modal'), ctx = req.ctx;
      const what = ctx.type === 'summon' ? '상대가 몬스터를 소환했다!' : ctx.type === 'switchIn' ? '상대가 비스트를 교체했다!' : '상대의 공격 선언!';
      this.setMsg(what + ' 함정을 발동할까?');
      m.className = 'modal';
      m.innerHTML = `<div class="mbox"><div class="mtitle">${what}</div><div class="tlist">${req.options.map((z) => `<button class="trow trap" data-act="trap" data-i="${z}"><img src="${A.cardUrl(sd.st[z].id)}"><div><b>${X.CARDS[sd.st[z].id].name}</b> 발동<br><small>${X.CARDS[sd.st[z].id].text}</small></div></button>`).join('')}</div><button class="btn" data-act="notrap">발동하지 않는다</button></div>`;
      this.acts = { trap: (d) => { m.className = 'hidden'; this.done({ type: 'trap', idx: +d.i }); }, notrap: () => { m.className = 'hidden'; this.done({ type: 'trap', idx: null }); } };
    },
    rulesModal() {
      const m = $('#b-modal'), mode = this.bt.mode, K = X.Battle.linkK(this.bt.s.link);
      const text = mode === 'tt' ? '<p><b>비스트 룰</b></p><p>양쪽이 동시에 행동을 고르고, 스피드가 빠른 쪽부터 움직인다. 상대의 비스트를 모두 쓰러뜨리면 승리.</p><p>속성 상성(2배/0.5배), 자속 보정(1.5배), 상태이상(독·화상·마비·수면)을 활용하자.</p>'
        : mode === 'dd' ? '<p><b>카드 룰</b></p><p>턴마다 1장 드로우, 몬스터 일반 소환은 1회. ★5~6은 제물 1장, ★7 이상은 제물 2장.</p><p>공격 표시끼리는 ATK 비교(차이만큼 LP 데미지). 수비 표시는 DEF로 막고 LP는 안전하다.</p><p>함정은 세트한 다음 턴부터 상대 행동에 맞춰 발동. LP가 0이 되거나 덱이 떨어지면 패배.</p>'
        : `<p><b>크로스 룰</b> — 각자 자기 규칙으로 싸운다. (링크 Lv.${this.bt.s.link})</p><p>● 테이머는 비스트가 모두 쓰러지면, 듀얼리스트는 LP가 0이 되면 패배.</p><p>● 비스트의 기술은 <b>스트라이크</b>(공격×${K.toFixed(0)}×위력/60×상성)가 된다. 몬스터의 ATK(수비 표시면 DEF) 이상이면 파괴하고, 공격 표시였다면 초과분이 LP 데미지. 못 부수면 충격으로 ATK/DEF를 스트라이크의 절반만큼 깎는다. 몬스터가 없으면 LP에 직접!</p><p>● 카드 몬스터의 공격은 비스트의 HP를 깎는다(속성 상성 적용). 반격 피해는 없다.</p><p>● <b>쾌속</b>: 비스트가 몬스터를 격파했을 때 스피드 환산치가 그 몬스터 레벨×400 이상이면 한 번 더 행동.</p><p>● 카드의 「파괴」는 비스트 최대 HP의 35% 피해, 효과 데미지는 선두 비스트가 대신 받는다. 상태이상은 양쪽 모두에 통한다 — 몬스터는 독(매 턴 ATK/DEF -200), 화상(ATK -30%), 마비·수면(공격 불가).</p>`;
      m.className = 'modal';
      m.innerHTML = `<div class="mbox wide rules">${text}<button class="btn" data-act="mclose">닫기</button></div>`;
      const prev = this.acts;
      this.acts = Object.assign({}, prev, { mclose: () => { m.className = 'hidden'; this.acts = prev; } });
    },

    // ── 듀얼리스트 커맨드 ──
    duelCmd() {
      const bt = this.bt;
      this.cmdBack = () => { $('#b-cmd').innerHTML = cmdHTML; this.setMsg('내 턴 — 카드를 골라 행동하자.'); };
      const cmdHTML = `<button class="btn big" data-act="end">턴 종료</button><button class="btn" data-act="rules">룰</button>${bt.s.wild ? '<button class="btn" data-act="run">도망</button>' : ''}`;
      $('#b-cmd').innerHTML = cmdHTML;
      this.acts = this.baseActs = { end: () => this.done({ type: 'end' }), rules: () => this.rulesModal(), run: () => this.done({ type: 'run' }) };
      this.renderHand();
    },
    cancelBtn() { $('#b-cmd').innerHTML = `<button class="btn" data-act="cancel">취소</button>`; },
    selectHand(h) {
      const bt = this.bt, sd = bt.side(UI.ME), id = sd.hand[h], c = X.CARDS[id], req = bt.request(UI.ME);
      if (!c) return;
      G.sfx('sel');
      this.sel = { hand: h };
      document.querySelectorAll('#b-hand .card').forEach((x, k) => x.classList.toggle('sel', k === h));
      let btns = '';
      const acts = Object.assign({}, this.baseActs);
      if (req && req.kind === 'duel') {
        if (c.kind === 'mon') {
          const info = bt.canSummon(UI.ME, h);
          if (info) {
            const go = (pos) => {
              const mine = bt.monZones(UI.ME);
              if (!info.need) return this.done({ type: 'summon', hand: h, pos, tributes: [] });
              if (mine.length === info.need) return this.done({ type: 'summon', hand: h, pos, tributes: mine });
              const chosen = [];
              const more = () => { this.cancelBtn(); this.pick(0, mine.filter((z) => !chosen.includes(z)), `제물로 바칠 몬스터를 고르자. (${chosen.length}/${info.need})`, (z) => { chosen.push(z); if (chosen.length === info.need) this.done({ type: 'summon', hand: h, pos, tributes: chosen }); else more(); }); };
              more();
            };
            btns += `<button class="btn" data-act="s-atk">${info.need ? `제물 ${info.need}장 바쳐 ` : ''}소환 (공격 표시)</button><button class="btn" data-act="s-set">세트 (뒷면 수비)</button>`;
            acts['s-atk'] = () => go('atk'); acts['s-set'] = () => go('set');
          } else btns += `<div class="cd-note">${sd.summoned ? '이번 턴은 이미 소환했다.' : bt.tributeNeed(c) ? `제물이 ${bt.tributeNeed(c)}장 필요하다.` : '몬스터 존이 가득 찼다.'}</div>`;
        } else if (c.kind === 'spell') {
          const info = bt.spellInfo(UI.ME, h);
          if (info) {
            btns += `<button class="btn" data-act="cast">발동</button>`;
            acts.cast = () => {
              if (!info.target) return this.done({ type: 'spell', hand: h });
              const side = info.target === 'opp' ? 1 : 0;
              const zones = bt.monZones(side ? UI.OP : UI.ME).filter((z) => side === 1 || !sd.mons[z].faceDown);
              if (zones.length === 1) return this.done({ type: 'spell', hand: h, target: zones[0] });
              this.cancelBtn();
              this.pick(side, zones, `「${c.name}」의 대상을 고르자.`, (z) => this.done({ type: 'spell', hand: h, target: z }));
            };
          } else btns += `<div class="cd-note">지금은 발동할 수 없다.</div>`;
        } else if (bt.freeZone(sd.st) >= 0) { btns += `<button class="btn" data-act="setst">세트</button>`; acts.setst = () => this.done({ type: 'setST', hand: h }); }
      }
      this.acts = acts;
      this.showDetail(X.cardDetail(id, `<div class="cd-btns">${btns}</div>`));
    },
    selectZone(side, d) {
      const bt = this.bt, v = this.v, sd = v.sides[side];
      if (sd.kind !== 'duelist') return;
      if (d.st != null) { const t = sd.st[+d.st]; if (t && t.id) { this.acts = Object.assign({}, this.baseActs); this.showDetail(X.cardDetail(t.id, t.faceDown ? '<div class="cd-note">세트된 카드</div>' : '')); } return; }
      const z = +d.zone, m = sd.mons[z];
      if (!m || m.hidden) return this.clearSel();
      G.sfx('sel');
      const acts = Object.assign({}, this.baseActs), req = bt.request(UI.ME);
      let btns = `<div class="cd-note">현재 ATK ${m.a} / DEF ${m.d} · ${m.faceDown ? '뒷면 수비' : m.pos === 'atk' ? '공격 표시' : '수비 표시'}${m.status ? ' · ' + X.STATUS[m.status] : ''}</div>`;
      if (side === 0 && req && req.kind === 'duel') {
        if (bt.canAttack(UI.ME, z)) {
          btns += `<button class="btn" data-act="attack">공격</button>`;
          acts.attack = () => {
            const opp = bt.side(UI.OP);
            if (opp.kind === 'tamer') return this.done({ type: 'attack', zone: z, target: 'beast' });
            const zones = bt.monZones(UI.OP);
            if (!zones.length) return this.done({ type: 'attack', zone: z, target: 'direct' });
            if (zones.length === 1) return this.done({ type: 'attack', zone: z, target: zones[0] });
            this.cancelBtn();
            this.pick(1, zones, '공격할 대상을 고르자.', (t) => this.done({ type: 'attack', zone: z, target: t }), (t) => { const T = v.sides[1].mons[t]; if (T.hidden) return ['?', '']; const val = T.pos === 'atk' ? T.a : T.d; return [`${m.a} ${m.a > val ? '>' : m.a === val ? '=' : '<'} ${val}`, m.a > val ? 'good' : 'bad']; });
          };
        } else if (!m.faceDown && m.pos === 'atk' && bt.s.turn <= 1) btns += `<div class="cd-note">첫 턴에는 공격할 수 없다.</div>`;
        if (bt.canChangePos(UI.ME, z)) { btns += `<button class="btn" data-act="pos">${m.faceDown ? '반전 소환' : m.pos === 'atk' ? '수비 표시로' : '공격 표시로'}</button>`; acts.pos = () => this.done({ type: 'pos', zone: z }); }
      }
      this.acts = acts;
      document.querySelectorAll('#battle .sel').forEach((x) => x.classList.remove('sel'));
      const e = $(`#bs${side} .mz[data-zone="${z}"]`); if (e) e.classList.add('sel');
      this.showDetail(X.cardDetail(m.id, `<div class="cd-btns">${btns}</div>`));
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);

    return new Promise((res) => {

    },

        { n: '중급 (Lv.24)', lv: 24, team: [['flarehound', 24], ['stormhawk', 23], ['aqualune', 24]], foe: [['leafron', 24], ['voltragon', 23], ['craggon', 24]], deck: 'mira2', fdeck: 'water' },
        { n: '상급 (Lv.42)', lv: 42, team: [['infernox', 43], ['tidedrake', 42], ['forestar', 42], ['voltragon', 41]], foe: [['seraphin', 42], ['magmaros', 42], ['nightpard', 42], ['lotusprite', 42]], deck: 'mira3', fdeck: 'dark' },

    // ── 메인 메뉴 ──
    open(tab) {

      const body = () => {

        tab: (d, m) => {

        single: (d, m) => { const pr = SINGLE_PRICE[X.CARDS[d.id].tier]; if (p.gold < pr) return; p.gold -= pr; G.giveCard(d.id); det = d.id; G.sfx('get'); m.paint(); },
        x: (d, m) => m.close(),
      }, { cls: 'wide', hover: (d) => { det = d.hover; const e = $('#shop-det'); if (e) e.innerHTML = X.cardDetail(det); } });
    },
    showCards(title, ids) {
      return modal(() => `<div class="mtitle">${title}</div><div class="reveal">${ids.map((id) => `<div class="rv">${X.cardHTML(id)}<small>${X.CARDS[id].text || (X.CARDS[id].kind === 'mon' ? 'ATK ' + X.CARDS[id].atk + ' / DEF ' + X.CARDS[id].def : '')}</small></div>`).join('')}</div><button class="btn big" data-act="x">확인</button>`, { x: (d, m) => m.close() }, { cls: 'mid', onA: (m) => m.close() });
    },
    showEvolution(old, b) {
      return modal(() => `<div class="evo"><img src="${A.beastUrl(b.sp)}"><div class="mtitle">축하합니다! ${old}${X.josa(old, '은/는').slice(old.length)} ${X.josa(X.BEASTS[b.sp].name, '으로/로')} 진화했다!</div><div>${X.BEASTS[b.sp].types.map(chip).join(' ')}</div><div class="bd-desc">${X.BEASTS[b.sp].desc}</div><button class="btn big" data-act="x">확인</button></div>`, { x: (d, m) => m.close() }, { cls: 'small', onA: (m) => m.close() });
    },
    async learnMove(b, moveId) {
      const mv = X.MOVES[moveId];
      const row = (m, k) => `<button class="move" data-act="pick" data-i="${k}" style="--tc:${X.TYPES[m.type].color}"><b>${m.name}</b><span>${X.TYPES[m.type].name} · ${m.pow ? '위력 ' + m.pow : '변화'} · 명중 ${m.acc}</span></button>`;
      const r = await modal(() => `<div class="mtitle">${X.josa(b.name, '은/는')} 「${mv.name}」을(를) 배우고 싶어 한다!</div><div class="hint">하지만 기술은 4개까지. 잊게 할 기술을 고르자.</div><div class="moves col1">${b.moves.map((m, k) => row(X.MOVES[m.id], k)).join('')}</div><div class="hint">새 기술 ↓</div><div class="moves col1">${row(mv, -1).replace('data-act="pick"', 'data-act="none" disabled')}</div><button class="btn" data-act="skip">배우지 않는다</button>`, { pick: (d, m) => m.close(+d.i), skip: (d, m) => m.close(-1) }, { cls: 'mid', noCancel: true });
      if (r >= 0) { const old = X.MOVES[b.moves[r].id].name; b.moves[r] = { id: moveId, pp: mv.pp }; await G.say(`${X.josa(b.name, '은/는')} ${X.josa(old, '을/를')} 잊고 ${X.josa(mv.name, '을/를')} 배웠다!`); }
    },
    starter(list) {
      let sel = null;
      return modal(() => `<div class="mtitle">파트너를 고르자</div><div class="starters">${list.map((id) => { const s = X.BEASTS[id]; return `<button class="starter${sel === id ? ' on' : ''}" data-act="sel" data-id="${id}"><img src="${A.beastUrl(id)}"><b>${s.name}</b>${s.types.map(chip).join('')}<small>${s.desc}</small></button>`; }).join('')}</div><button class="btn big" data-act="ok" ${sel ? '' : 'disabled'}>${sel ? X.josa(X.BEASTS[sel].name, '으로/로') + ' 결정!' : '비스트를 선택'}</button>`, { sel: (d, m) => { sel = d.id; m.paint(); }, ok: (d, m) => sel && m.close(sel) }, { cls: 'wide', noCancel: true });
    },
    box() {
      const p = G.p;
      return modal(() => `<div class="mtitle">비스트 보관함</div><div class="split"><div><h3>동행 (${p.team.length}/6) <small>클릭: 맡기기</small></h3><div class="tlist">${p.team.map((b, k) => beastRow(b, k, 'dep', '', p.team.length <= 1)).join('')}</div></div><div><h3>보관함 (${p.box.length}) <small>클릭: 데려가기</small></h3><div class="tlist">${p.box.length ? p.box.map((b, k) => beastRow(b, k, 'wd', '', p.team.length >= 6)).join('') : '<div class="hint">보관함이 비어 있다.</div>'}</div></div></div><button class="btn" data-act="x">닫기</button>`, {
        dep: (d, m) => { if (p.team.length <= 1) return; const b = p.team.splice(+d.i, 1)[0]; X.healBeast(b); p.box.push(b); m.paint(); },
        wd: (d, m) => { if (p.team.length >= 6) return; p.team.push(p.box.splice(+d.i, 1)[0]); m.paint(); },
        x: (d, m) => m.close(),
      }, { cls: 'wide' });
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);

// ── js/net/client.js ──
// 멀티플레이: 서버 컴퓨터 하나에 모두 접속해 같은 세계를 공유한다.
//  - 같은 맵에 있는 다른 플레이어가 보이고, 말을 걸면 대전 신청 (비스트/덱 어느 쪽이든, 크로스 배틀 포함)
//  - 채팅 (T 키 또는 💬 버튼)
//  - 대전은 서버가 엔진으로 판정하고, 확정된 행동 순서를 양쪽에 보내 같은 전투를 재생한다 (락스텝)
// 서버 없이 열면(아티팩트/파일) 이 모듈은 조용히 꺼지고 싱글 플레이로 동작한다.
(function (root) {
  const X = root.XG, G = X.G, A = X.Art, OW = X.OW;
  const $ = (s) => document.querySelector(s);
  const TS = 48, FEET = 0.82, STEP = 150;
  const TILT = 50 * Math.PI / 180, CO = Math.cos(TILT), SI = Math.sin(TILT);
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const boardM = (x, y, h) => `matrix3d(1,0,0,0,0,${CO},${-SI},0,0,${SI},${CO},0,${x},${y - h * CO},${h * SI},1)`;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MODE_KO = { beast: '비스트', deck: '덱' };

  const N = (X.Net = {
    enabled: !!root.CL_SERVER && /^https?:$/.test(location.protocol),
    on: false, ws: null, id: null, players: {}, bq: [], bEnd: null, waiters: [], pending: null, lastKey: '', inBattle: false,
    WAKE: { type: '__wake' },

    connect() {
      if (!this.enabled || this.ws) return;
      const ws = (this.ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'));
      ws.onopen = () => { this.on = true; this.lastKey = ''; this.hello(); this.hud(); };
      ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (er) { return; } this.recv(m); };
      ws.onclose = () => {
        const was = this.on;
        this.on = false; this.ws = null; this.players = {}; this.hud();
        if (this.inBattle) { this.bEnd = { winner: null, reason: 'lost' }; this.wakeAll(); }
        if (this.pending) { this.pending({ t: 'reply', ok: false, reason: 'offline' }); this.pending = null; }
        if (was) G.toast('서버와 연결이 끊겼다. 다시 연결 중…', 2500);
        setTimeout(() => this.connect(), 3000);
      };
    },
    send(m) { if (this.on) this.ws.send(JSON.stringify(m)); },
    hello() { const p = G.p; if (p) this.send({ t: 'hello', name: p.name, map: p.map, x: p.x, y: p.y, dir: p.dir }); },

    // 매 프레임: 내 위치가 바뀌면 전송 (이동 중이면 목적지 칸)
    tick(pl, map) {
      if (!this.on || !map) return;
      const x = pl.moving ? pl.x + DIRS[pl.dir][0] : pl.x, y = pl.moving ? pl.y + DIRS[pl.dir][1] : pl.y;
      const key = map.id + ',' + x + ',' + y + ',' + pl.dir;
      if (key !== this.lastKey) { this.lastKey = key; this.send({ t: 'pos', map: map.id, x, y, dir: pl.dir }); }
    },

    recv(m) {
      const P = this.players;
      switch (m.t) {
        case 'welcome': this.id = m.id; this.players = {}; for (const p of m.players) if (p.id !== m.id) this.players[p.id] = this.mkP(p); this.hud(); this.chatLine(null, `서버에 접속했다. (접속 중 ${m.players.length}명)`); break;
        case 'join': if (m.p.id !== this.id) { P[m.p.id] = this.mkP(m.p); this.hud(); this.chatLine(null, `${m.p.name}님이 접속했다.`); } break;
        case 'leave': if (P[m.id]) { this.chatLine(null, `${P[m.id].name}님이 나갔다.`); this.dropEl(P[m.id]); delete P[m.id]; this.hud(); } break;
        case 'pos': { const p = P[m.id]; if (!p) break; if (p.map !== m.map) { p.rx = m.x; p.ry = m.y; } Object.assign(p, { map: m.map, x: m.x, y: m.y, dir: m.dir }); break; }
        case 'state': { const p = P[m.id]; if (p) { p.busy = m.busy; this.hud(); } break; }
        case 'chat': this.chatLine(m.name, m.text, m.id === this.id); break;
        case 'challenge': this.onChallenge(m); break;
        case 'reply': case 'b:start': if (this.pending) { const f = this.pending; this.pending = null; f(m); } else if (m.t === 'b:start') this.startBattle(m); break;
        case 'b:act': case 'b:reject': this.bq.push(m); this.wakeAll(); break;
        case 'b:end': if (this.inBattle) { this.bEnd = { winner: m.winner, reason: m.reason }; this.wakeAll(); } break;
        case 'notice': G.toast(m.text, 2500); break;
        case 'admin:rename': { const p = P[m.id]; if (p) { p.name = m.name; this.hud(); this.chatLine(null, `관리자가 플레이어 이름을 ${m.name}(으)로 변경했다.`); } break; }
      }
    },
    mkP(p) { return Object.assign({ rx: p.x, ry: p.y }, p); },
    waitBattle() { return new Promise((r) => this.waiters.push(r)); },
    wakeAll() { const w = this.waiters.splice(0); w.forEach((f) => f()); if (this.bEnd && X.BattleUI.done) X.BattleUI.wake(); },
    waitReply() { return new Promise((r) => { this.pending = r; }); },

    // ── 대전 ──
    // PvP는 저장 데이터를 건드리지 않는다: 팀은 사본을 풀 회복해서 쓰고, 도구는 사용 불가, 경험치/상금 없음.
    mySide(mode) {
      const p = G.p;
      if (mode === 'beast') { const team = X.clone(p.team); team.forEach((b) => X.healBeast(b)); return { kind: 'tamer', team }; }
      return { kind: 'duelist', deck: p.deck.slice() };
    },
    async challengeMenu(o) {
      if (!this.on) return;
      if (o.busy) return G.say(`${o.name}님은 지금 대전 중이다.`);
      const c = await G.choose(`${o.name}님에게 무엇을 할까?`, ['대전 신청', '그만둔다'], o.name, 1);
      if (c !== 0) return;
      const mode = await G.pickMode();
      if (!mode) return G.say('싸울 수 있는 비스트도, 덱도 없다…!');
      this.send({ t: 'challenge', to: o.id, mode, side: this.mySide(mode) });
      G.toast(`${o.name}님의 응답을 기다리는 중…`, 20000);
      const r = await this.waitReply();
      $('#toast').classList.remove('on');
      if (r.t === 'b:start') return this.startBattle(r);
      const why = { busy: '지금은 대전을 받을 수 없는 상태다.', declined: '대전을 거절했다.', timeout: '응답이 없다.', gone: '이미 떠난 것 같다.', offline: '서버와 연결이 끊겼다.' }[r.reason] || '대전이 성사되지 않았다.';
      await G.say(`${o.name}님은 ${why}`);
    },
    free() { return G.scene === 'world' && !G.lock && !G.inputStack.length && $('#overlay').classList.contains('hidden') && !this.inBattle; },
    onChallenge(m) {
      if (!this.free()) return this.send({ t: 'decline', from: m.from, reason: 'busy' });
      G.held.length = 0;
      G.run(async () => {
        const c = await G.choose(`${m.name}님이 대전을 신청했다! (상대: ${MODE_KO[m.mode]})`, ['받는다', '거절한다'], null, 1);
        if (c !== 0) return this.send({ t: 'decline', from: m.from, reason: 'declined' });
        const mode = await G.pickMode();
        if (!mode) { await G.say('싸울 수 있는 비스트도, 덱도 없다…!'); return this.send({ t: 'decline', from: m.from, reason: 'declined' }); }
        this.send({ t: 'accept', from: m.from, side: this.mySide(mode) });
        const r = await this.waitReply();
        if (r.t === 'b:start') return this.startBattle(r);
        await G.say('대전이 취소되었다.');
      });
    },
    async startBattle(m) {
      if (!G.lock) return G.run(() => this.startBattle(m));
      this.bq = []; this.bEnd = null; this.inBattle = true; this.lastKey = '';
      let res;
      try {
        res = await X.BattleUI.run({ net: { bid: m.bid, me: m.me, init: m.init }, foeLook: m.foe.look, intro: `${m.foe.name}님과의 대전! 【${m.label}】`, bg: (OW.map && OW.map.bg) || 'field' });
      } finally { this.inBattle = false; this.bq = []; this.bEnd = null; this.send({ t: 'b:leave', bid: m.bid }); }
      if (res.reason === 'lost') await G.say('서버 연결이 끊겨 대전이 중단되었다.');
      else await G.say(res.winner === 0 ? `${m.foe.name}님과의 대전에서 승리했다!` : `${m.foe.name}님과의 대전에서 졌다…`);
    },

    // ── 필드에 다른 플레이어 그리기 ──
    dropEl(p) { if (p.el) { p.el.remove(); p.sh.remove(); p.tag.remove(); p.el = null; } },
    drawOthers(dt) {
      const map = OW.map;
      for (const id in this.players) {
        const p = this.players[id];
        if (!map || p.map !== map.id || !this.on) { this.dropEl(p); continue; }
        if (!p.el || !p.el.isConnected) {
          p.sh = X.el('div', 'f3 shadow3'); p.el = X.el('div', 'f3 ent net-p'); p.tag = X.el('div', 'f3 net-tag');
          OW.plane.appendChild(p.sh); OW.plane.appendChild(p.el); OW.plane.appendChild(p.tag); p._k = '';
        }
        // 목표 칸으로 한 칸/150ms 속도로 따라간다
        const sp = dt / STEP, dx = p.x - p.rx, dy = p.y - p.ry, dist = Math.hypot(dx, dy);
        if (dist > 3) { p.rx = p.x; p.ry = p.y; } else if (dist > 0) { const k = Math.min(1, sp / dist); p.rx += dx * k; p.ry += dy * k; }
        const moving = dist > 0.01;
        p.walk = moving ? (p.walk || 0) + dt : 0;
        const px = p.rx * TS, py = (p.ry + FEET) * TS, bob = moving ? Math.abs(Math.sin((p.walk / STEP) * Math.PI)) * 4 : 0;
        p.el.style.transform = boardM(px, py, TS + bob * 2);
        p.sh.style.transform = `translate3d(${px + 6}px,${py - 9}px,1px)`;
        p.tag.style.transform = boardM(px - 36, py, TS + 22);
        const f = moving ? Math.floor(p.walk / 75) % 2 : 0, key = p.look + p.dir + f;
        if (key !== p._k) { p._k = key; p.el.style.backgroundImage = `url(${A.charFrame(p.look, p.dir, f)})`; }
        const tg = (p.busy ? '⚔ ' : '') + p.name;
        if (p.tag._t !== tg) { p.tag._t = tg; p.tag.innerHTML = `<span>${esc(tg)}</span>`; }
      }
    },
    facing() {
      if (!this.on || !OW.map) return null;
      const pl = OW.pl, [dx, dy] = DIRS[pl.dir], x = pl.x + dx, y = pl.y + dy;
      return Object.values(this.players).find((p) => p.map === OW.map.id && p.x === x && p.y === y) || null;
    },

    // ── HUD: 접속자 목록 + 채팅 ──
    buildHud() {
      const hud = $('#hud');
      hud.appendChild(X.el('div', '', '')).id = 'net-list';
      const chat = X.el('div', '', `<div id="chat-log"></div><div id="chat-row"><button id="chat-btn" title="채팅 (T)">💬</button><input id="chat-in" maxlength="80" placeholder="메시지 입력 후 Enter" autocomplete="off"></div>`);
      chat.id = 'chat'; hud.appendChild(chat);
      const inp = $('#chat-in');
      const open = () => { if (!this.on) return; chat.classList.add('open'); G.held.length = 0; inp.focus(); };
      const close = () => { chat.classList.remove('open'); inp.value = ''; inp.blur(); };
      $('#chat-btn').onclick = () => (chat.classList.contains('open') ? close() : open());
      inp.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { const t = inp.value.trim(); if (t) this.send({ t: 'chat', text: t }); close(); }
        else if (e.key === 'Escape') close();
      });
      addEventListener('keydown', (e) => { if (e.target.tagName !== 'INPUT' && (e.key === 't' || e.key === 'T') && this.on && G.scene !== 'title') { e.preventDefault(); open(); } });
      this.hud();
    },
    hud() {
      const L = $('#net-list'), C = $('#chat');
      if (!L) return;
      const show = this.enabled && G.scene && G.scene !== 'title';
      L.style.display = C.style.display = show ? '' : 'none';
      const ps = Object.values(this.players);
      L.innerHTML = this.on ? `<b>● 온라인 ${ps.length + 1}명</b>${ps.map((p) => `<div>${p.busy ? '⚔ ' : ''}${esc(p.name)}<small>${esc((X.WORLD.maps[p.map] || {}).name || '')}</small></div>`).join('')}` : '<b class="off">● 서버 연결 중…</b>';
    },
    chatLine(name, text, mine) {
      const L = $('#chat-log'); if (!L) return;
      const d = X.el('div', name ? (mine ? 'me' : '') : 'sys', name ? `<b>${esc(name)}</b> ${esc(text)}` : esc(text));
      L.appendChild(d);
      while (L.children.length > 7) L.firstChild.remove();
      setTimeout(() => d.classList.add('old'), 12000);
    },
  });

  if (!N.enabled) return;

  // ── 기존 코드에 연결 ──
  const oUpdate = OW.update, oDraw = OW.draw, oInteract = OW.interact, oStart = G.startWorld;
  OW.update = function (dt) { oUpdate.call(this, dt); N.tick(this.pl, this.map); };
  OW.draw = function () { oDraw.call(this); N.drawOthers(this._ndt || 16); };
  let last = performance.now();
  (function measure(now) {
    OW._ndt = Math.min(50, now - last); last = now;
    const w = G.scene === 'world', l = $('#net-list'), c = $('#chat');
    if (l) { l.style.visibility = w ? '' : 'hidden'; c.style.visibility = w ? '' : 'hidden'; }
    requestAnimationFrame(measure);
  })(last);
  OW.interact = function () { const o = N.facing(); if (o) return G.run(() => N.challengeMenu(o)); return oInteract.call(this); };
  G.startWorld = function () { oStart.call(this); N.hud(); if (N.on) { N.hello(); N.lastKey = ''; } else N.connect(); };
  N.buildHud();
})(typeof globalThis !== 'undefined' ? globalThis : this);

XG.G.boot();
</script>
